<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MournDeath</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body {
    background: #090915; /* 带微弱紫青调的深邃宇宙底色 */
    color: #f3f3ff;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}


/* 导航 */

nav{

    position:fixed;
    top:0;
    width:100%;
    padding:30px 60px;
    display:flex;
    justify-content:space-between;
    z-index:10;

    background: rgba(9, 9, 21, 0.65);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);

}

.logo{

    font-size:20px;
    letter-spacing:6px;
    font-weight:bold;

}

.menu{

    font-size:12px;
    letter-spacing:4px;
    opacity:.7;

}



/* 首页 */

.hero{

    min-height:700px;

    height:85vh;

    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
    
}


/* 梦幻星云光斑 */
.background {
    position: absolute;
    inset: -20%;
    /* 替换为你的图片路径，并在上方叠一层深色遮罩保证白字可读 */
    background: 
        linear-gradient(to bottom, rgba(9, 9, 21, 0.4) 0%, rgba(9, 9, 21, 0.85) 100%),
        url("LuNa_1.png") center/cover no-repeat
    filter: blur(40px); /* 强化梦幻雾感 */
}

.background::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image: 
        radial-gradient(rgba(255, 255, 255, 0.9) 1.5px, transparent 1.5px),
        radial-gradient(rgba(192, 132, 252, 0.6) 1px, transparent 1px);
    background-size: 90px 90px, 45px 45px;
    opacity: 0.25;
    animation: particles 25s linear infinite;
}



@keyframes particles{

from{

transform:translateY(0);

}


to{

transform:translateY(-100px);

}

}
    

@keyframes breath{

from{
transform:scale(1);
}

to{
transform:scale(1.15);
}

}

@keyframes moveLight{

0%{

background-position:30% 40%;

}


100%{

background-position:70% 60%;

}

}
    


.content{

    position:relative;
    text-align:center;

    animation:intro 3s ease;

}



@keyframes intro{

from{

opacity:0;
transform:translateY(40px);

}

to{

opacity:1;
transform:translateY(0);

}

}

@keyframes fadeButton{

from{

opacity:0;

}

to{

opacity:1;

}

}
    
@keyframes fadeText{

from{

opacity:0;

transform:translateY(20px);

}

to{

opacity:.6;

transform:translateY(0);

}

}
    
@keyframes titleReveal{

0%{

opacity:0;

filter:blur(15px);

transform:scale(1.1);

}


100%{

opacity:1;

filter:blur(0);

transform:scale(1);

}

}


.small{

font-size:12px;
letter-spacing:8px;
opacity:.6;
margin-bottom:30px;

}



h1 {
    font-size: clamp(70px, 12vw, 160px);
    letter-spacing: -3px;
    line-height: .9;
    /* 梦幻微光文字描边与发光 */
    background: linear-gradient(135deg, #ffffff 40%, #c084fc 80%, #60a5fa 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 40px rgba(192, 132, 252, 0.4);
}

.subtitle{

margin-top:40px;
font-size:13px;
letter-spacing:6px;

opacity:0;

animation:fadeText 2s ease forwards;

animation-delay:2s;

}



.button {
    display: inline-block;
    margin-top: 70px;
    padding: 15px 40px;
    border: 1px solid rgba(192, 132, 252, 0.4);
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(12px);
    color: #e2e8f0;
    letter-spacing: 5px;
    border-radius: 40px; /* 圆角胶囊按钮更显梦幻空灵 */
    box-shadow: 0 0 20px rgba(147, 51, 234, 0.2);
    transition: 0.4s;
}

.button:hover {
    background: rgba(255, 255, 255, 0.95);
    color: #090915;
    box-shadow: 0 0 35px rgba(192, 132, 252, 0.7);
    transform: translateY(-2px);
}

/* 作品 */

section{

padding:180px 8% 120px;

}



.title{

font-size:70px;
letter-spacing:-3px;
margin-bottom:60px;

}



.card {
    height: 500px;
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px; /* 柔和边缘 */
    display: flex;
    align-items: end;
    padding: 50px;
    transition: .6s;
    position: relative;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
}

.card img{

position:absolute;

top:0;
left:0;

width:100%;
height:100%;

object-fit:cover;

opacity:.6;

z-index:0;

}

.card:hover {
    transform: translateY(-8px) scale(1.01);
    border-color: rgba(192, 132, 252, 0.5);
    box-shadow: 0 20px 50px rgba(147, 51, 234, 0.25);
}



.card h2{

font-size:60px;

position:relative;

z-index:2;

}




/* 图片区域 */


.gallery{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:30px;

}


.box{

height:400px;

background:#151515;

transition:.5s;

}


.box:hover{

transform:translateY(-20px);

}

.works-header{
    display:flex;
    justify-content:space-between;
    align-items:end;
    margin-bottom:50px;
}

.works-label{
    font-size:11px;
    letter-spacing:5px;
    opacity:.45;
}

.work-item{
    position:relative;
    height:620px;
    overflow:hidden;
    background:#0d0d1a;
    border:1px solid rgba(192, 132, 252, 0.2);
    border-radius:20px;
    cursor:pointer;
    box-shadow:0 10px 40px rgba(0,0,0,0.5);
}

.work-item img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    transition:transform 1.2s ease;
}

.work-item:hover img{
    transform:scale(1.05);
}
    
.work-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(
        to top,
        rgba(9, 9, 21, 0.95) 15%,
        rgba(147, 51, 234, 0.2) 60%,
        transparent
    );
}

.work-info{
    position:absolute;
    left:55px;
    right:55px;
    bottom:50px;
    display:flex;
    justify-content:space-between;
    align-items:end;
}

.work-number{
    position:absolute;
    top:35px;
    left:35px;
    font-size:11px;
    letter-spacing:4px;
    opacity:.45;
}

.work-category{
    font-size:10px;
    letter-spacing:4px;
    opacity:.5;
    margin-bottom:15px;
}

.work-name{
    font-size:clamp(42px,6vw,80px);
    letter-spacing:-3px;
    line-height:.9;
}

.work-description{
    font-size:12px;
    letter-spacing:2px;
    opacity:.5;
    margin-top:18px;
}

.work-link{
    border:1px solid rgba(192, 132, 252, 0.4);
    border-radius:20px;
    background:rgba(255, 255, 255, 0.05);
    backdrop-filter:blur(8px);
    transition:.4s;
}

.work-item:hover .work-link{
    background:#c084fc;
    color:#090915;
    box-shadow:0 0 20px rgba(192, 132, 252, 0.6);
}

@media(max-width:700px){

    .work-item{
        height:500px;
    }

    .work-info{
        left:25px;
        right:25px;
        bottom:30px;
    }

    .work-link{
        display:none;
    }
}


footer{

padding:60px;

border-top:1px solid #222;

text-align:center;

opacity:.5;

letter-spacing:4px;

}



@media(max-width:700px){

nav{

padding:20px;

}

.gallery{

grid-template-columns:1fr;

}

.title{

font-size:45px;

}

}

</style>


</head>


<body>



<nav>

<div class="logo">
MOURNDEATH
</div>

<div class="menu">
ARCHIVE
</div>

</nav>



<div class="hero">


<div class="background"></div>


<div class="content">


<div class="small">
GAMES · ART · WORLDS
</div>


<h1>
MOURN<br>
DEATH
</h1>


<div class="subtitle">
ENTER THE UNKNOWN
</div>


<a class="button" href="#works">
ENTER
</a>


</div>


</div>





<section id="works" style="scroll-margin-top:180px;">

<div class="works-header">

    <div>
        <div class="title">Works</div>
        <div class="works-label">SELECTED PROJECTS</div>
    </div>

</div>

<div class="work-item">

    <img src="XiaoLu_1.png">

    <div class="work-overlay"></div>

    <div class="work-number">01 / 01</div>

    <div class="work-info">

        <div>

            <div class="work-category">
                GAME · WORLD · CONCEPT
            </div>

            <div class="work-name">
                PROJECT 001
            </div>

            <div class="work-description">
                A WORLD WAITING TO BE DISCOVERED
            </div>

        </div>

        <div class="work-link">
            VIEW PROJECT →
        </div>

    </div>

</div>

</section>

<section>

<div class="title">
Gallery
</div>



<div class="gallery">


<div class="box"></div>

<div class="box"></div>

<div class="box"></div>

<div class="box"></div>


</div>



</section>





<footer>

MOURNDEATH © 2026

</footer>


<script>

const background = document.querySelector(".background");
const content = document.querySelector(".content");


document.addEventListener("mousemove", function(e){

    let x = (e.clientX / window.innerWidth - 0.5) * 20;
    let y = (e.clientY / window.innerHeight - 0.5) * 20;


    background.style.transform =
    `translate(${x}px, ${y}px) scale(1.1)`;


    content.style.transform =
    `translate(${x * 0.3}px, ${y * 0.3}px)`;

});

</script>

</body>

</html>
