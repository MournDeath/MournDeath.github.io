<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MournDeath</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            background: #090915;
            color: #f3f3ff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            overflow-x: hidden;
        }

        /* 顶部导航 */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 24px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            background: rgba(9, 9, 21, 0.4);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .logo {
            font-size: 16px;
            letter-spacing: 6px;
            font-weight: 700;
        }

        .menu {
            font-size: 12px;
            letter-spacing: 3px;
            opacity: .6;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .menu:hover {
            opacity: 1;
        }

        /* 首屏 Hero 视口 */
        .hero {
            height: 100vh;
            min-height: 700px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* 梦幻背景图与星斑 */
        .background {
            position: absolute;
            inset: -50px; /* 留出视差移动余量，防止边缘露白 */
            background: 
                linear-gradient(to bottom, rgba(9, 9, 21, 0.4) 0%, rgba(9, 9, 21, 0.9) 100%),
                url("LuNa_1.png") center 20% / cover no-repeat;
            transition: transform 0.15s ease-out;
            will-change: transform;
            z-index: 1;
        }

        .background::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(rgba(255, 255, 255, 0.8) 1.5px, transparent 1.5px),
                radial-gradient(rgba(192, 132, 252, 0.5) 1px, transparent 1px);
            background-size: 90px 90px, 45px 45px;
            opacity: 0.25;
            animation: particles 25s linear infinite;
        }

        @keyframes particles {
            from { transform: translateY(0); }
            to { transform: translateY(-90px); }
        }

        /* 核心内容区 */
        .content-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: intro 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            will-change: transform;
        }

        @keyframes intro {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .small {
            font-size: 11px;
            letter-spacing: 7px;
            opacity: .6;
            margin-bottom: 24px;
        }

        h1 {
            font-size: clamp(56px, 11vw, 130px);
            letter-spacing: -2px;
            line-height: 0.92;
            background: linear-gradient(135deg, #ffffff 30%, #c084fc 75%, #60a5fa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 35px rgba(192, 132, 252, 0.35));
            user-select: none;
        }

        .subtitle {
            margin-top: 25px;
            font-size: 12px;
            letter-spacing: 6px;
            opacity: .65;
        }

        /* 传送门导航卡片 (新增与补全) */
        .portal-nav {
            display: flex;
            gap: 20px;
            margin-top: 50px;
        }

        .portal-box {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            width: 140px;
            padding: 16px 20px;
            text-decoration: none;
            color: #f3f3ff;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
            transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .portal-tag {
            font-size: 10px;
            letter-spacing: 2px;
            color: #c084fc;
            margin-bottom: 6px;
            opacity: 0.8;
        }

        .portal-title {
            font-size: 13px;
            letter-spacing: 3px;
            font-weight: 600;
        }

        .portal-box:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(192, 132, 252, 0.6);
            box-shadow: 0 12px 35px rgba(147, 51, 234, 0.3);
        }

        /* 页脚 */
        footer {
            padding: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            text-align: center;
            opacity: .4;
            font-size: 11px;
            letter-spacing: 4px;
            position: relative;
            z-index: 10;
        }

        @media (max-width: 600px) {
            nav {
                padding: 20px 24px;
            }

            .portal-nav {
                flex-direction: column;
                width: 75vw;
                gap: 12px;
            }

            .portal-box {
                width: 100%;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }

            .portal-tag {
                margin-bottom: 0;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">MOURNDEATH</div>
        <div class="menu">ARCHIVE</div>
    </nav>

    <div class="hero">
        <div class="background"></div>

        <div class="content-wrapper" id="content">
            <div class="small">GAMES · ART · WORLDS</div>
            <h1>
                MOURN<br>
                DEATH
            </h1>
            <div class="subtitle">TO UNDERSTAND</div>

            <div class="portal-nav">
                <a href="works.html" class="portal-box">
                    <span class="portal-tag">01</span>
                    <span class="portal-title">WORKS</span>
                </a>
                <a href="gallery.html" class="portal-box">
                    <span class="portal-tag">02</span>
                    <span class="portal-title">GALLERY</span>
                </a>
                <a href="about.html" class="portal-box">
                    <span class="portal-tag">03</span>
                    <span class="portal-title">ARCHIVE</span>
                </a>
            </div>
        </div>
    </div>

    <footer>
        MOURNDEATH © 2026
    </footer>

    <script>
        const background = document.querySelector(".background");
        const content = document.getElementById("content");

        // 仅在非触摸屏（电脑端）启用视差跟手，防止手机端产生卡顿与位移错误
        if (window.matchMedia("(hover: hover)").matches) {
            window.addEventListener("mousemove", (e) => {
                const x = (e.clientX / window.innerWidth - 0.5) * 24;
                const y = (e.clientY / window.innerHeight - 0.5) * 24;

                background.style.transform = `translate(${x}px, ${y}px) scale(1.08)`;
                content.style.transform = `translate(${x * 0.35}px, ${y * 0.35}px)`;
            });
        }
    </script>
</body>

</html>
