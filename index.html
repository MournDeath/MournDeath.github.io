<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MournDeath — Characters</title>
    <!-- 设置网页标签图标 -->
    <link rel="icon" type="image/png" href="logo.png">
    <!-- 引入独立样式表 -->
    <link rel="stylesheet" href="style.css">
</head>

<!-- 星云毛玻璃密码遮罩 -->
<div id="pwdGate" style="
  position: fixed; inset: 0; z-index: 99999;
  background: radial-gradient(circle at 50% 50%, rgba(26, 11, 46, 0.45) 0%, rgba(8, 4, 18, 0.7) 100%),
              url('LuNa_1.png') center/cover no-repeat;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  display: flex; align-items: center; justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
">
  <div style="
    background: rgba(22, 16, 36, 0.65);
    border: 1px solid rgba(168, 85, 247, 0.28);
    box-shadow: 0 0 35px rgba(147, 51, 234, 0.2), 0 25px 50px rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    padding: 40px 32px; border-radius: 18px; width: 100%; max-width: 360px;
    text-align: center; box-sizing: border-box;
  ">
    <div style="
      font-size: 11px; letter-spacing: 3px; color: #c084fc;
      font-weight: 600; text-transform: uppercase; margin-bottom: 6px;
    ">MournDeath</div>
    <div style="
      font-size: 10px; letter-spacing: 2px; color: rgba(255, 255, 255, 0.45);
      margin-bottom: 24px;
    ">ARCHIVE / CHARACTERS</div>

    <div style="
      width: 44px; height: 44px; margin: 0 auto 18px; border-radius: 50%;
      background: rgba(168, 85, 247, 0.12); border: 1px solid rgba(168, 85, 247, 0.35);
      display: flex; align-items: center; justify-content: center; color: #d8b4fe;
    ">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>

    <h2 style="color: #f3e8ff; font-size: 19px; margin: 0 0 8px; font-weight: 600; letter-spacing: 1px;">RESTRICTED ACCESS</h2>
    <p style="color: rgba(216, 180, 254, 0.7); font-size: 12px; margin: 0 0 24px;">请输入访问密码解锁档案</p>

    <input id="pwdInput" type="password" placeholder="PASSWORD" style="
      width: 100%; box-sizing: border-box; padding: 13px 16px;
      background: rgba(12, 8, 24, 0.75); border: 1px solid rgba(168, 85, 247, 0.35);
      border-radius: 10px; color: #f3e8ff; font-size: 14px; letter-spacing: 2px;
      outline: none; margin-bottom: 14px; text-align: center;
    " onkeydown="if(event.key==='Enter') verifyPwd()">

    <button onclick="verifyPwd()" style="
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #7e22ce 0%, #a855f7 100%);
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.35);
      border: none; border-radius: 10px; color: #fff; font-size: 13px;
      font-weight: 600; letter-spacing: 2px; cursor: pointer;
    ">ENTER ARCHIVE</button>

    <div id="pwdErr" style="color: #f472b6; font-size: 12px; margin-top: 14px; display: none;">密码错误，请重新输入</div>
  </div>
</div>

<script>
  (function() {
    if (sessionStorage.getItem("auth") === "true") {
      document.getElementById("pwdGate").style.display = "none";
    }
  })();

  function verifyPwd() {
    const pwd = document.getElementById("pwdInput").value;
    const correct = "249205";
    if (pwd === correct) {
      sessionStorage.setItem("auth", "true");
      document.getElementById("pwdGate").style.display = "none";
    } else {
      const err = document.getElementById("pwdErr");
      err.style.display = "block";
      document.getElementById("pwdInput").value = "";
    }
  }
</script>
    
<body>

    <nav>
        <div class="logo">MOURNDEATH</div>
        <div class="nav-subtitle">ARCHIVE / CHARACTERS</div>
    </nav>

    <main class="container">
        <div class="header-title">
            <span class="tag">01 / ROSTER</span>
            <h1>CHARACTERS</h1>
        </div>

        <!-- 角色列表容器 -->
        <div class="char-grid" id="charactersList"></div>
    </main>

    <!-- 风格展示浮层 -->
    <div class="char-modal" id="charModal">
        <div class="modal-header">
            <div class="modal-char-info">
                <h2 id="modalName"></h2>
                <p id="modalBio"></p>
            </div>
            <button class="close-btn" id="closeBtn">CLOSE ✕</button>
        </div>

        <div class="styles-grid" id="modalStylesGrid"></div>
    </div>

    <!-- 引入独立脚本 -->
    <script src="main.js"></script>
</body>
</html>
