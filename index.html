<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MournDeath — Characters</title>
    <!-- 引入独立样式表 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <div class="logo">MOURNDEATH</div>
        <div class="nav-subtitle">ARCHIVE / CHARACTERS</div>
    </nav>

    <main class="container">
        <div class="header-title">
            <span class="tag">01 / ROSTER</span>
            <h1>CHARACTERS</h1>
        </div>

        <!-- 角色列表容器 -->
        <div class="char-grid" id="charactersList"></div>
    </main>

    <!-- 风格展示浮层 -->
    <div class="char-modal" id="charModal">
        <div class="modal-header">
            <div class="modal-char-info">
                <h2 id="modalName"></h2>
                <p id="modalBio"></p>
            </div>
            <button class="close-btn" id="closeBtn">CLOSE ✕</button>
        </div>

        <div class="styles-grid" id="modalStylesGrid"></div>
    </div>

    <!-- 引入独立脚本 -->
    <script src="main.js"></script>
</body>
</html>
