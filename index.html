<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MournDeath — Characters</title>
    <!-- 设置网页标签图标 -->
    <link rel="icon" type="image/png" href="logo.png">
    <!-- 引入独立样式表 -->
    <link rel="stylesheet" href="style.css">
</head>

<script>
  (function() {
    const password = "249205"; // 替换成你想设置的密码
    if (sessionStorage.getItem("auth") !== "true") {
      const input = prompt("该页面受密码保护，请输入访问密码：");
      if (input === password) {
        sessionStorage.setItem("auth", "true");
      } else {
        alert("密码错误，无法查看！");
        window.location.replace("https://www.google.com");
      }
    }
  })();
</script>
    
<body>

    <nav>
        <div class="logo">MOURNDEATH</div>
        <div class="nav-subtitle">ARCHIVE / CHARACTERS</div>
    </nav>

    <main class="container">
        <div class="header-title">
            <span class="tag">01 / ROSTER</span>
            <h1>CHARACTERS</h1>
        </div>

        <!-- 角色列表容器 -->
        <div class="char-grid" id="charactersList"></div>
    </main>

    <!-- 风格展示浮层 -->
    <div class="char-modal" id="charModal">
        <div class="modal-header">
            <div class="modal-char-info">
                <h2 id="modalName"></h2>
                <p id="modalBio"></p>
            </div>
            <button class="close-btn" id="closeBtn">CLOSE ✕</button>
        </div>

        <div class="styles-grid" id="modalStylesGrid"></div>
    </div>

    <!-- 引入独立脚本 -->
    <script src="main.js"></script>
</body>
</html>
