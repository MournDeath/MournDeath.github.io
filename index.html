<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MournDeath</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#050505;
    color:white;
    font-family:Arial, Helvetica, sans-serif;
    overflow-x:hidden;
}


/* 导航 */

nav{

    position:fixed;
    top:0;
    width:100%;
    padding:30px 60px;
    display:flex;
    justify-content:space-between;
    z-index:10;

    background:rgba(5,5,5,0.85);
    backdrop-filter:blur(10px);

}

.logo{

    font-size:20px;
    letter-spacing:6px;
    font-weight:bold;

}

.menu{

    font-size:12px;
    letter-spacing:4px;
    opacity:.7;

}



/* 首页 */

.hero{

    min-height:700px;

    height:85vh;

    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
    
}


.background{

    position:absolute;
    inset:-20%;

    background:
    radial-gradient(
    circle at 50% 50%,
    #444,
    #080808 60%
    );

    animation:
    moveLight 15s infinite alternate;

    overflow:hidden;

}

.background::after{

content:"";

position:absolute;

inset:0;


background-image:
radial-gradient(
white 1px,
transparent 1px
);


background-size:80px 80px;


opacity:0.08;


animation:particles 20s linear infinite;

}



@keyframes particles{

from{

transform:translateY(0);

}


to{

transform:translateY(-100px);

}

}
    

@keyframes breath{

from{
transform:scale(1);
}

to{
transform:scale(1.15);
}

}

@keyframes moveLight{

0%{

background-position:30% 40%;

}


100%{

background-position:70% 60%;

}

}
    


.content{

    position:relative;
    text-align:center;

    animation:intro 3s ease;

}



@keyframes intro{

from{

opacity:0;
transform:translateY(40px);

}

to{

opacity:1;
transform:translateY(0);

}

}

@keyframes fadeButton{

from{

opacity:0;

}

to{

opacity:1;

}

}
    
@keyframes fadeText{

from{

opacity:0;

transform:translateY(20px);

}

to{

opacity:.6;

transform:translateY(0);

}

}
    
@keyframes titleReveal{

0%{

opacity:0;

filter:blur(15px);

transform:scale(1.1);

}


100%{

opacity:1;

filter:blur(0);

transform:scale(1);

}

}


.small{

font-size:12px;
letter-spacing:8px;
opacity:.6;
margin-bottom:30px;

}



h1{

font-size:clamp(70px,12vw,160px);
letter-spacing:-5px;
line-height:.85;

animation:titleReveal 2.5s ease forwards;

opacity:0;

}



.subtitle{

margin-top:40px;
font-size:13px;
letter-spacing:6px;

opacity:0;

animation:fadeText 2s ease forwards;

animation-delay:2s;

}



.button{

display:inline-block;
margin-top:70px;

padding:15px 40px;

border:1px solid #555;

color:white;
text-decoration:none;

letter-spacing:5px;
font-size:12px;

transition:.5s;

}


.button:hover{

background:white;
color:black;

}



/* 作品 */

section{

padding:180px 8% 120px;

}



.title{

font-size:70px;
letter-spacing:-3px;
margin-bottom:60px;

}



.card{

height:500px;

background:

linear-gradient(
120deg,
#222,
#080808
);

display:flex;
align-items:end;

padding:50px;

transition:.6s;

position:relative;
overflow:hidden;
    
}

.card img{

position:absolute;

top:0;
left:0;

width:100%;
height:100%;

object-fit:cover;

opacity:.6;

z-index:0;

}

.card:hover{

transform:scale(1.03);

}



.card h2{

font-size:60px;

position:relative;

z-index:2;

}




/* 图片区域 */


.gallery{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:30px;

}


.box{

height:400px;

background:#151515;

transition:.5s;

}


.box:hover{

transform:translateY(-20px);

}




footer{

padding:60px;

border-top:1px solid #222;

text-align:center;

opacity:.5;

letter-spacing:4px;

}



@media(max-width:700px){

nav{

padding:20px;

}

.gallery{

grid-template-columns:1fr;

}

.title{

font-size:45px;

}

}

</style>


</head>


<body>



<nav>

<div class="logo">
MOURNDEATH
</div>

<div class="menu">
ARCHIVE
</div>

</nav>



<div class="hero">


<div class="background"></div>


<div class="content">


<div class="small">
GAMES · ART · WORLDS
</div>


<h1>
MOURN<br>
DEATH
</h1>


<div class="subtitle">
ENTER THE UNKNOWN
</div>


<a class="button" href="#works">
ENTER
</a>


</div>


</div>





<section id="works" style="scroll-margin-top:180px;">


<div class="title">
Works
</div>

<div class="card">

<img src="XiaoLu_1.png">

<div>
<h2>
PROJECT 001
</h2>

</div>

</div>

</section>

<section>


<div class="title">
Gallery
</div>



<div class="gallery">


<div class="box"></div>

<div class="box"></div>

<div class="box"></div>

<div class="box"></div>


</div>



</section>





<footer>

MOURNDEATH © 2026

</footer>


<script>

const background = document.querySelector(".background");
const content = document.querySelector(".content");


document.addEventListener("mousemove", function(e){

    let x = (e.clientX / window.innerWidth - 0.5) * 20;
    let y = (e.clientY / window.innerHeight - 0.5) * 20;


    background.style.transform =
    `translate(${x}px, ${y}px) scale(1.1)`;


    content.style.transform =
    `translate(${x * 0.3}px, ${y * 0.3}px)`;

});

</script>

</body>

</html>
