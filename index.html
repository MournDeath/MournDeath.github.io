<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MournDeath — Characters</title>
    <!-- 设置网页标签图标 -->
    <link rel="icon" type="image/png" href="logo.png">
    <!-- 引入独立样式表 -->
    <link rel="stylesheet" href="style.css">
</head>

<!-- 网页内嵌密码遮罩 -->
<div id="pwdGate" style="
  position: fixed; inset: 0; background: #0f1117; z-index: 99999;
  display: flex; align-items: center; justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
">
  <div style="
    background: #1a1d24; border: 1px solid #2d3139; padding: 36px 32px;
    border-radius: 12px; width: 100%; max-width: 360px; text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  ">
    <div style="font-size: 13px; letter-spacing: 2px; color: #8b949e; margin-bottom: 8px;">RESTRICTED ACCESS</div>
    <h2 style="color: #fff; font-size: 20px; margin: 0 0 20px;">请输入访问密码</h2>
    <input id="pwdInput" type="password" placeholder="输入密码" style="
      width: 100%; box-sizing: border-box; padding: 12px 14px; background: #0f1117;
      border: 1px solid #30363d; border-radius: 6px; color: #fff; font-size: 15px;
      outline: none; margin-bottom: 12px;
    " onkeydown="if(event.key==='Enter') verifyPwd()">
    <button onclick="verifyPwd()" style="
      width: 100%; padding: 12px; background: #238636; border: none; border-radius: 6px;
      color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
    ">确认进入</button>
    <div id="pwdErr" style="color: #f85149; font-size: 13px; margin-top: 12px; display: none;">密码错误，请重试</div>
  </div>
</div>

<script>
  (function() {
    if (sessionStorage.getItem("auth") === "true") {
      document.getElementById("pwdGate").style.display = "none";
    }
  })();

  function verifyPwd() {
    const pwd = document.getElementById("pwdInput").value;
    const correct = "249205"; // 你的密码
    if (pwd === correct) {
      sessionStorage.setItem("auth", "true");
      document.getElementById("pwdGate").style.display = "none";
    } else {
      const err = document.getElementById("pwdErr");
      err.style.display = "block";
      document.getElementById("pwdInput").value = "";
    }
  }
</script>
    
<body>

    <nav>
        <div class="logo">MOURNDEATH</div>
        <div class="nav-subtitle">ARCHIVE / CHARACTERS</div>
    </nav>

    <main class="container">
        <div class="header-title">
            <span class="tag">01 / ROSTER</span>
            <h1>CHARACTERS</h1>
        </div>

        <!-- 角色列表容器 -->
        <div class="char-grid" id="charactersList"></div>
    </main>

    <!-- 风格展示浮层 -->
    <div class="char-modal" id="charModal">
        <div class="modal-header">
            <div class="modal-char-info">
                <h2 id="modalName"></h2>
                <p id="modalBio"></p>
            </div>
            <button class="close-btn" id="closeBtn">CLOSE ✕</button>
        </div>

        <div class="styles-grid" id="modalStylesGrid"></div>
    </div>

    <!-- 引入独立脚本 -->
    <script src="main.js"></script>
</body>
</html>
